liip_imagine:
  driver: "gd"

  twig:
    mode: lazy

  loaders:
    default:
      filesystem:
        data_root: "%kernel.project_dir%/public"

  resolvers:
    default:
      web_path:
        web_root: "%kernel.project_dir%/public"
        cache_prefix: "media/cache"

  filter_sets:
    cache: ~

    game_thumb:
      quality: 75
      filters:
        thumbnail:
          size: [400, 250]
          mode: outbound
    game_small:   # petite
      filters:
        thumbnail: { size: [200, 120], mode: outbound }