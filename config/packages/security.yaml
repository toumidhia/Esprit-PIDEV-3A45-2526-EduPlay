security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  providers:
    # ✅ Provider DB (sera utilisé quand ton camarade intègre l’auth)
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

    # ✅ Provider mémoire (pour tester maintenant)
    users_in_memory:
      memory:
        users:
          parent_test:
            password: '$2y$13$kCcIYZ57AKBnfwwZXqh0QeCiBObBIsjWeYUEJxMzho4YIauJw1CkS'
            roles: [ROLE_PARENT]

    # ✅ Chain: Symfony va chercher d’abord en mémoire, puis en DB
    chain_provider:
      chain:
        providers: [users_in_memory, app_user_provider]

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: chain_provider
      http_basic: ~

      # Quand ton camarade aura form_login/custom_authenticator, vous remplacerez http_basic
      # form_login:
      #   login_path: app_login
      #   check_path: app_login
      # logout:
      #   path: app_logout
      #   target: front_event_index

  access_control:
    # ✅ pages publiques
    - { path: ^/events$, roles: PUBLIC_ACCESS }
    - { path: ^/events/\d+$, roles: PUBLIC_ACCESS }

    # ✅ inscription: protégé
    - { path: ^/events/\d+/register$, roles: ROLE_PARENT }
    - { path: ^/my-registrations, roles: ROLE_PARENT }

    # ✅ routes auth (si vous les ajoutez plus tard)
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }

    # ✅ exemples (à activer quand vous aurez ces sections)
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/parent, roles: ROLE_PARENT }
    - { path: ^/enseignant, roles: ROLE_ENSEIGNANT }
    - { path: ^/enfant, roles: ROLE_ENFANT }

    # ✅ tout le reste public pour l’instant
    - { path: ^/, roles: PUBLIC_ACCESS }

  role_hierarchy:
    ROLE_ADMIN: [ROLE_USER]
    ROLE_PARENT: [ROLE_USER]
    ROLE_ENSEIGNANT: [ROLE_USER]
    ROLE_ENFANT: [ROLE_USER]

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
