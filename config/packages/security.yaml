security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # ✅ Provider DB (sera utilisé quand ton camarade intègre l’auth)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

        # ✅ Provider mémoire (pour tester maintenant)
        users_in_memory:
            memory:
                users:
                    parent_test:
                        # IMPORTANT: mets ici un vrai hash (commande plus bas)
                        password: '$2y$13$kCcIYZ57AKBnfwwZXqh0QeCiBObBIsjWeYUEJxMzho4YIauJw1CkS'
                        roles: [ROLE_PARENT]

        # ✅ Chain: Symfony va chercher d’abord en mémoire, puis en DB
        chain_provider:
            chain:
                providers: [users_in_memory, app_user_provider]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: chain_provider

            # ✅ login simple pour tester (tu peux utiliser http_basic)
            http_basic: ~

            # (quand ton camarade aura form_login, vous pouvez remplacer http_basic par form_login)
            # form_login:
            #     login_path: app_login
            #     check_path: app_login
            # logout:
            #     path: app_logout
            #     target: front_event_index

    access_control:
        # ✅ pages publiques
        - { path: ^/events$, roles: PUBLIC_ACCESS }
        - { path: ^/events/\d+$, roles: PUBLIC_ACCESS }

        # ✅ inscription: protégé (comme en prod/intégration)
        - { path: ^/events/\d+/register$, roles: ROLE_PARENT }

        # ✅ tout le reste public pour l’instant (ajuste selon ton projet)
        - { path: ^/, roles: PUBLIC_ACCESS }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
