security:
    # Configuration du hashage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Provider pour charger les utilisateurs
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # Utiliser notre custom authenticator
            custom_authenticator: App\Security\LoginFormAuthenticator

            # Déconnexion
            logout:
                path: app_logout
                target: app_home

    # Contrôle d'accès par routes
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/parent, roles: ROLE_PARENT }
        - { path: ^/enseignant, roles: ROLE_ENSEIGNANT }
        - { path: ^/enfant, roles: ROLE_ENFANT }
        - { path: ^/shop, roles: ROLE_USER }
        - { path: ^/jeux, roles: ROLE_USER }
        - { path: ^/games, roles: ROLE_USER }
        - { path: ^/events, roles: ROLE_USER }

        - { path: ^/, roles: PUBLIC_ACCESS }

    # Hiérarchie des rôles
    role_hierarchy:
        ROLE_ADMIN: [ROLE_ENSEIGNANT, ROLE_PARENT, ROLE_ENFANT, ROLE_USER]
        ROLE_ENSEIGNANT: [ROLE_USER]
        ROLE_PARENT: [ROLE_USER]
        ROLE_ENFANT: [ROLE_USER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10