security:
    enable_authenticator_manager: true
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false



    access_control:
        - { path: ^/enseignant, roles: [ ROLE_TEACHER ] }
        - { path: ^/parent, roles: [ ROLE_PARENT ] }
        - { path: ^/back/office, roles: [ ROLE_ADMIN, ROLE_TEACHER ] }
        - { path: ^/course, roles: PUBLIC_ACCESS }
        - { path: ^/dashboard, roles: [ ROLE_ADMIN ] }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

    # Hiérarchie des rôles
    role_hierarchy:
        ROLE_ADMIN: [ROLE_TEACHER, ROLE_USER,ROLE_PARENT]
        ROLE_TEACHER: [ROLE_USER]
        ROLE_PARENT: [ROLE_USER]
        ROLE_KID: [ROLE_USER]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10