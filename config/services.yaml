# config/services.yaml
# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Paramètres pour l'upload des PDF
    courses_pdf_directory: '%kernel.project_dir%/public/uploads/courses_pdfs'

    # Paramètres pour les emails
    app.admin_email: 'noreply@eduplay.com'
    app.admin_name: 'EduPlay'

    upload_directory: '%kernel.project_dir%/public/uploads/games'
    upload_tmp_directory_games: '%kernel.project_dir%/public/uploads/tmp'
    event_images_dir: '%kernel.project_dir%/public/uploads/events'
    uploads_directory: '%kernel.project_dir%/public/uploads'
    uploads_path: '/uploads'
    dfs_directory: '%kernel.project_dir%/public/pdfs'


    #ai pour game
    openai.api_key: '%env(OPENAI_API_KEY)%'
    openai.model: '%env(OPENAI_MODEL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Liaison des paramètres aux arguments des services
            string $adminEmail: '%app.admin_email%'
            string $adminName: '%app.admin_name%'
            
            #api ai pour game 
            string $openaiApiKey: '%env(OPENAI_API_KEY)%'
            string $openaiModel: '%env(OPENAI_MODEL)%'
    

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Configuration explicite du service Email
    App\Service\EmailService:
        arguments:
            $router: '@router'
            $mailer: '@mailer'  # Changé de '@mailer.mailer' à '@mailer'
            $logger: '@logger'
    App\Service\PdfExtractorService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Configuration explicite du service Stripe
    App\Service\StripePaymentService:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
      